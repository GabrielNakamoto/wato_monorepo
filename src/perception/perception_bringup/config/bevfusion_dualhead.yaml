/**/bevfusion_node:
  ros__parameters:
    lidar_frame_id: "LIDAR_TOP"
    input_lidar_topic: "/LIDAR_TOP"
    camera_names:
    - "CAM_FRONT"
    - "CAM_FRONT_RIGHT"
    - "CAM_FRONT_LEFT"
    - "CAM_BACK"
    - "CAM_BACK_LEFT"
    - "CAM_BACK_RIGHT"
    model_dir: "/opt/watonomous/models/bevfusion/dualhead"
    precision: "fp16"
    det_enabled: true
    seg_enabled: true
    seg_num_classes: 6
    # per-class operating points (nuScenes val best thresholds, model order
    # drivable, ped_crossing, walkway, stop_line, carpark_area, divider)
    seg_class_thresholds: [0.45, 0.35, 0.45, 0.35, 0.35, 0.40]
    xbound: [-54.0, 54.0, 0.3]
    ybound: [-54.0, 54.0, 0.3]
    zbound: [-10.0, 10.0, 20.0]
    dbound: [1.0, 60.0, 0.5]
    geometry_dim: [360, 360, 80]
    feat_width: 88
    feat_height: 32
    min_range: [-54.0, -54.0, -5.0]
    max_range: [54.0, 54.0, 3.0]
    voxel_size: [0.075, 0.075, 0.2]
    max_voxels: 160000
    max_points: 300000
    max_points_per_voxel: 10
    num_features: 5
    scn_order: "XYZ"
    out_size_factor: 8
    transbbox_pc_range: [-54.0, -54.0]
    transbbox_voxel_size: [0.075, 0.075]
